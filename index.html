    <script>
      // Ensure window.fetch is writable and robust in sandboxed iframe environments
      try {
        let _currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
        Object.defineProperty(window, 'fetch', {
          get() {
            return _currentFetch;
          },
          set(newFetch) {
            _currentFetch = newFetch;
          },
          configurable: true,
          enumerable: true
        });
      } catch (e) {
        // Fallback silently if environment prevents redefining
      }
